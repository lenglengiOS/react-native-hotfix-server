services:
  hotfix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOTFIX_VERSION: 0.1.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOTFIX_BASE_URL: "${HOTFIX_BASE_URL:-https://updates.example.com}"
      HOTFIX_MAX_BYTES: "${HOTFIX_MAX_BYTES:-209715200}"
      HOTFIX_STORAGE_DIR: /data
      HOTFIX_PRIVATE_KEY: /run/secrets/hotfix_private_key
    command:
      - /bin/sh
      - -c
      - HOTFIX_ADMIN_TOKEN="$$(cat /run/secrets/hotfix_admin_token)" exec hotfix-server
    volumes:
      - hotfix-data:/data
    secrets:
      - hotfix_private_key
      - hotfix_admin_token
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  hotfix_private_key:
    file: ../.secrets/hotfix_private_key.pem
  hotfix_admin_token:
    file: ../.secrets/hotfix_admin_token

volumes:
  hotfix-data:
